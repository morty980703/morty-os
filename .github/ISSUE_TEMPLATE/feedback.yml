name: 网站问题与建议
description: 反馈页面问题、失效链接或使用建议
title: "[反馈] "
body:
  - type: input
    id: page
    attributes:
      label: 页面地址
      placeholder: https://morty-os.vercel.app/tools
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: 问题或建议
      description: 你在做什么？实际看到了什么？希望怎样改进？
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与浏览器（可选）
      placeholder: 手机 / 电脑，浏览器名称
